# ==============================================================================
# Ligament Enterprise Platform — Единый оркестратор модулей
# Документация: https://github.com/aligorov/ligament
# ==============================================================================
# Управление профилями (COMPOSE_PROFILES в .env):
#   core       - Центральное ядро 2FA (PostgreSQL + Core Web/API/RADIUS/СКУД)
#   chat       - Корпоративный мессенджер Ligament Chat (порт :8097)
#   recorder   - Запись медиа/сессий Ligament Recorder + AI Worker (порт :8095)
#   ticket     - Helpdesk/тикет-система Ligament Ticket (порт :8096)
#   guard      - Kiosk-монитор охраны Ligament Guard (порт :8090)
#   all        - Запуск всех центральных модулей стека
#
# Примеры запуска:
#   docker compose up -d                      # Запуск сервисов активного профиля
#   docker compose --profile all up -d        # Принудительный запуск всего стека
#   docker compose logs -f twofa              # Логи конкретного сервиса
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. CORE 2FA: База данных PostgreSQL (TCP)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ligament-core-db
    profiles: ["core", "all"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: twofa
      POSTGRES_PASSWORD: "${TWOFA_PG_PASSWORD:-twofa_secret}"
      POSTGRES_DB: twofa
    volumes:
      - twofa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twofa -d twofa"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ligament-net

  # ----------------------------------------------------------------------------
  # 2. CORE 2FA: Центральный сервер (WebUI, API, RADIUS, СКУД, SSO)
  # ----------------------------------------------------------------------------
  twofa:
    image: aligorov/ligament_2fa:${TWOFA_IMAGE_TAG:-latest}
    container_name: ligament-core
    hostname: ligament-auth
    profiles: ["core", "all"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TWOFA_DB_DSN: "host=db port=5432 user=twofa dbname=twofa password='${TWOFA_PG_PASSWORD:-twofa_secret}'"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.0/8,::1/128,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}"
      # ICE / STUN / TURN интеграция (если настроен внешний ICE на VPS)
      TURN_SERVER: "${LIG_TURN_SERVER:-}"
      TURN_USER: "${LIG_TURN_USER:-ligament}"
      TURN_SECRET: "${LIG_TURN_PASSWORD:-}"
    ports:
      - "${LIG_HTTP_PORT:-80}:8080"
      - "${LIG_APP_PORT:-8080}:8080"
      - "${LIG_RADIUS_AUTH:-1812}:1812/udp"
      - "${LIG_RADIUS_ACCT:-1813}:1813/udp"
    volumes:
      - /etc/machine-id:/etc/host-machine-id:ro
    networks:
      - ligament-net

  # ----------------------------------------------------------------------------
  # 3. CHAT: База данных PostgreSQL (Изолированная, Unix domain socket)
  # ----------------------------------------------------------------------------
  chat-db:
    image: postgres:16-alpine
    container_name: ligament-chat-db
    profiles: ["chat", "all"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_DB: ligament_chat
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - "postgres"
      - "-c"
      - "listen_addresses="
      - "-c"
      - "unix_socket_directories=/var/run/postgresql"
      - "-c"
      - "unix_socket_permissions=0777"
    volumes:
      - chat_pgdata:/var/lib/postgresql/data
      - chat_pgsocket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h /var/run/postgresql -U chat -d ligament_chat"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ligament-net

  # ----------------------------------------------------------------------------
  # 4. CHAT: Корпоративный мессенджер + P2P WebRTC сигнализация звонков
  # ----------------------------------------------------------------------------
  chat:
    image: aligorov/ligament_chat:${CHAT_IMAGE_TAG:-latest}
    container_name: ligament-chat
    profiles: ["chat", "all"]
    restart: unless-stopped
    depends_on:
      chat-db:
        condition: service_healthy
    volumes:
      - chat_pgsocket:/var/run/postgresql
      - chat_data:/var/lib/ligament-chat
    ports:
      - "${LIG_CHAT_PORT:-8097}:8097"
    command:
      - "-listen"
      - "0.0.0.0:8097"
      - "-data-dir"
      - "/var/lib/ligament-chat"
      - "-db-socket"
      - "/var/run/postgresql"
      - "-db-user"
      - "chat"
      - "-db-name"
      - "ligament_chat"
      - "-core-url"
      - "${LIG_CORE_URL:-http://twofa:8080}"
      - "-recorder-url"
      - "${LIG_RECORDER_URL:-http://recorder:8095}"
    networks:
      - ligament-net

  # ----------------------------------------------------------------------------
  # 5. RECORDER: База данных PostgreSQL (Изолированная, Zero-ENV Unix socket)
  # ----------------------------------------------------------------------------
  recorder-db:
    image: postgres:16-alpine
    container_name: ligament-recorder-db
    profiles: ["recorder", "all"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: recorder
      POSTGRES_DB: ligament_recorder
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - "postgres"
      - "-c"
      - "listen_addresses="
      - "-c"
      - "unix_socket_directories=/var/run/postgresql"
      - "-c"
      - "unix_socket_permissions=0777"
    volumes:
      - recorder_pgdata:/var/lib/postgresql/data
      - recorder_pgsocket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h /var/run/postgresql -U recorder -d ligament_recorder"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ligament-net

  # ----------------------------------------------------------------------------
  # 6. RECORDER: Запись сессий/звонков + AI Worker (Zero-ENV)
  # ----------------------------------------------------------------------------
  recorder:
    image: aligorov/ligament_recoder:${RECORDER_IMAGE_TAG:-latest}
    container_name: ligament-recoder
    profiles: ["recorder", "all"]
    restart: unless-stopped
    depends_on:
      recorder-db:
        condition: service_healthy
    volumes:
      - recorder_pgsocket:/var/run/postgresql
      - recorder_data:/var/lib/ligament-recorder
    ports:
      - "${LIG_RECORDER_PORT:-8095}:8095"
    command:
      - "-listen"
      - "0.0.0.0:8095"
      - "-data-dir"
      - "/var/lib/ligament-recorder"
      - "-db-socket"
      - "/var/run/postgresql"
      - "-db-user"
      - "recorder"
      - "-db-name"
      - "ligament_recorder"
    networks:
      - ligament-net

  # ----------------------------------------------------------------------------
  # 7. TICKET: База данных PostgreSQL (Изолированная, Unix domain socket)
  # ----------------------------------------------------------------------------
  ticket-db:
    image: postgres:16-alpine
    container_name: ligament-ticket-db
    profiles: ["ticket", "all"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticket
      POSTGRES_DB: ligament_ticket
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - "postgres"
      - "-c"
      - "listen_addresses="
      - "-c"
      - "unix_socket_directories=/var/run/postgresql"
      - "-c"
      - "unix_socket_permissions=0777"
    volumes:
      - ticket_pgdata:/var/lib/postgresql/data
      - ticket_pgsocket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h /var/run/postgresql -U ticket -d ligament_ticket"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ligament-net

  # ----------------------------------------------------------------------------
  # 8. TICKET: Helpdesk / Заявки / Инциденты (Zero-Blob: медиа в Recorder)
  # ----------------------------------------------------------------------------
  ticket:
    image: aligorov/ligament_ticket:${TICKET_IMAGE_TAG:-latest}
    container_name: ligament-ticket
    profiles: ["ticket", "all"]
    restart: unless-stopped
    depends_on:
      ticket-db:
        condition: service_healthy
    volumes:
      - ticket_pgsocket:/var/run/postgresql
    ports:
      - "${LIG_TICKET_PORT:-8096}:8096"
    command:
      - "-listen"
      - "0.0.0.0:8096"
      - "-db-socket"
      - "/var/run/postgresql"
      - "-db-user"
      - "ticket"
      - "-db-name"
      - "ligament_ticket"
      - "-core-url"
      - "${LIG_CORE_URL:-http://twofa:8080}"
      - "-recorder-url"
      - "${LIG_RECORDER_URL:-http://recorder:8095}"
    networks:
      - ligament-net

  # ----------------------------------------------------------------------------
  # 9. GUARD: Kiosk-монитор КПП и турникетов (SSE поток проходов охраны)
  # ----------------------------------------------------------------------------
  guard:
    image: aligorov/ligament_guard:${GUARD_IMAGE_TAG:-latest}
    container_name: ligament-guard
    profiles: ["guard", "all"]
    restart: unless-stopped
    ports:
      - "${LIG_GUARD_PORT:-8090}:8090"
    command:
      - "-port"
      - "8090"
      - "-core-url"
      - "${LIG_CORE_URL:-http://twofa:8080}"
    networks:
      - ligament-net

volumes:
  twofa_pgdata:
  chat_pgdata:
  chat_pgsocket:
  chat_data:
  recorder_pgdata:
  recorder_pgsocket:
  recorder_data:
  ticket_pgdata:
  ticket_pgsocket:

networks:
  ligament-net:
    name: ligament-net
    driver: bridge
