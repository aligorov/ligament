# ==============================================================================
# Ligament Relay — Периферийный edge-сервер филиала для оффлайн-автономии 2FA
# ==============================================================================
# Разворачивается в локальной сети филиала / удаленного офиса.
# Требует config/relay.yaml с параметрами подключения к центральному ядру.
# ==============================================================================

services:
  relay:
    image: aligorov/ligament-relay:${RELAY_IMAGE_TAG:-latest}
    container_name: ligament-relay
    restart: unless-stopped
    network_mode: "host"
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./config/relay.yaml:/app/config.yaml:ro
      - relay_data:/app/data

volumes:
  relay_data:
